tasks:
  memory_summarization_task:
    description: |-
      Identify whether the current query explicitly references or depends on a previous message
      (e.g., mentions like “question 2,” “the second one,” “that law,” “same topic,” “previous answer”).
      If such a reference exists, locate the most relevant message in session_memory and rewrite
      the user query as a *resolved_query* — a clear, explicit version that includes the referenced content.
      
      Extract only the details from session_memory and personal_memory that are directly relevant
      to the resolved_query.
      Summarize these details factually, preserving legal terms, article numbers, dates, and
      prior reasoning steps when present.

      Inputs:
      - query: {query}
      - session_memory: {session_memory}
      - personal_memory: {personal_memory}
    expected_output: |-
      A JSON object containing:
      - session_notes: concise summary of relevant session memory
      - personal_notes: concise summary of relevant personal memory
      - resolved_query: rewritten query with references made explicit
    agent: memory_summarizer

  retrieval_strategy_task:
    description: |-
      Analyze the QUERY and determine the best retrieval strategy and assistant.
      1) Optionally rewrite the QUERY for better retrieval (preserve meaning and language).
      2) Choose the appropriate assistant/collection: "soliq" or "umumiy".
      3) Choose strategy: "hybrid", "dense", "sparse", or "specific".
      4) Provide reasoning for your choices.

      Query: {query}
    expected_output: |-
      A JSON object with exactly the keys: query_rewrite, strategy, assistant, reasoning.
    agent: retrieval_specialist

  context_evaluation_task:
    description: |-
      Analyze the QUERY and RETRIEVED_CONTEXT to determine if there is enough information to answer the question.
      Evaluation criteria:
      1. Does the context contain relevant information that directly addresses the query?
      2. Is the information complete enough to provide a satisfactory answer?
      3. Are there specific legal articles, regulations, or facts needed but missing?
      
      Query: {query}
      Retrieved Context: {context}
    expected_output: |-
      A JSON object with:
      - is_sufficient: true | false
      - reasoning: brief explanation
      - missing_info: what is missing if insufficient
    agent: context_evaluator

  web_search_task:
    description: |-
      Use WebSearchTool to find authoritative legal sources for the QUERY.
      Evaluate search results for relevance and authority.
      Return URLs, titles, and summarized content of the most credible sources.
      
      Query: {query}
    expected_output: |-
      A JSON object containing a list of documents, each with url, title, and content.
    agent: web_search_summarizer

  final_answer_generation_task:
    description: |-
      Synthesize only the provided legal texts into a precise, user-appropriate legal answer.
      You never invent sources or facts beyond CONTEXT. You strictly obey citation formatting.
      
      Query: {query}
      Resolved Query: {resolved_query}
      Context: {context}
      Chat History: {chat_history}
    expected_output: |-
      A comprehensive legal answer based strictly on the provided context.
    agent: final_answer

