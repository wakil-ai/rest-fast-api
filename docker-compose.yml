services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - 8080:8080
    env_file:
      - .env
    environment:
      - MILVUS_URI=http://milvus-standalone:19530/
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PYTHONUNBUFFERED=1
      - PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION=python
    networks:
      - wakilai-bridge
    restart: unless-stopped
    depends_on:
      - milvus-standalone
      - redis
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  milvus-standalone:
    image: milvusdb/milvus:v2.5.14
    ports:
      - "19530:19530"
      - "9091:9091"
      - "2379:2379"
    environment:
      - ETCD_USE_EMBED=true
      - ETCD_CONFIG_PATH=/milvus/configs/embedEtcd.yaml
      - ETCD_DATA_DIR=/var/lib/milvus/etcd
      - COMMON_STORAGETYPE=local
    volumes:
      - ${MILVUS_CACHE_DIR}/volumes/milvus:/var/lib/milvus:rw
      - ${MILVUS_CACHE_DIR}/embedEtcd.yaml:/milvus/configs/embedEtcd.yaml:rw
      - ${MILVUS_CACHE_DIR}/user.yaml:/milvus/configs/user.yaml:rw
    command: ["milvus", "run", "standalone"]
    networks:
      - wakilai-bridge
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9091/healthz || exit 1"]
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 90s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - wakilai-bridge
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  wakilai-bridge:
    driver: bridge

volumes:
  milvus_data:
  redis_data: