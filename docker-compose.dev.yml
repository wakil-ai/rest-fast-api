services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - 8085:8080
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION=python
    networks:
      - restwakil-ai_wakilai-bridge
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8085/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  restwakil-ai_wakilai-bridge:
    external: true